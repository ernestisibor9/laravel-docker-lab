services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_docker_lab_app
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - laravel-net

    nginx:
        image: nginx:alpine
        container_name: laravel_docker_lab_nginx
        ports:
            - "8081:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - laravel-net

    mysql:
        image: mysql:8.0
        container_name: laravel_docker_lab_mysql
        environment:
            MYSQL_DATABASE: laravel_docker_lab
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel_password
            MYSQL_ROOT_PASSWORD: root_password
        ports:
            - "3309:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-uroot",
                    "-proot_password",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - laravel-net

    redis:
        image: redis:7-alpine
        container_name: laravel_docker_lab_redis
        ports:
            - "6380:6379"
        networks:
            - laravel-net

networks:
    laravel-net:
        driver: bridge

volumes:
    mysql_data:
